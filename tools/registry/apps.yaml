# Project registry
# Synced by skill-spark registry scan: source of truth is actual dir contents; entries are added/moved/deleted and desc is preserved
# skill-spark registry clone reads this file and clones each project into its path field

projects:
  # === base ===
  - name: flock
    repo: https://github.com/Onelevenvy/flock.git
    path: base/references/desktop-ref/flock
    desc: Innate base/template projects

  # === innate-spark/base ===
  - name: innate-backend
    repo: https://github.com/variableway/innate-backend.git
    path: innate-spark/base/innate-backend
    desc: Go 后端基座（innate-go CLI、backend-go skill、scripts）
    kind: base

  - name: innate-fe-base
    repo: https://github.com/variableway/innate-fe-templates.git
    path: innate-spark/base/innate-fe-base
    desc: 前端基座 monorepo（@innate/* 包与 Admin 模板）
    kind: base
    publishes: ["@innate/ui", "@innate/admin-composites", "@innate/scene-catalog", "@innate/scene-specs", "@innate/scene-mocks", "@innate/agent-ui", "@innate/fe-skillkits", "@innate/tsconfig"]

  - name: innate-backend
    repo: https://github.com/variableway/innate-backend.git
    path: innate-spark/base/innate-backend
    desc: Hub-hosted shared base projects

  - name: innate-fe-base
    repo: https://github.com/variableway/innate-fe-templates.git
    path: innate-spark/base/innate-fe-base
    desc: Hub-hosted shared base projects
    publishes: ["@innate/ui"]

  - name: innate-wip
    repo: https://github.com/variableway/innate-wip.git
    path: innate-spark/base/innate-fe-base/apps/innate-wip
    desc: Hub-hosted shared base projects
