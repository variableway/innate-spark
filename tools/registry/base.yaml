# Hub base registry（落点：本仓 base/，靠 hubScanDirs）
# 日常也可写在 apps.yaml；本表用于「只更新 base」：
#   bun tools/innate-registry-cli/src/cli.ts clone --registry tools/registry/base.yaml

projects:
  # === base ===
  - name: innate-backend
    repo: https://github.com/variableway/innate-backend.git
    path: base/innate-backend
    kind: base
    desc: Go 后端基座（innate-go CLI、backend-go skill、scripts）

  - name: innate-fe-base
    repo: https://github.com/variableway/innate-fe-templates.git
    path: base/innate-fe-base
    kind: base
    publishes:
      - "@innate/ui"
      - "@innate/admin-composites"
      - "@innate/scene-catalog"
      - "@innate/scene-specs"
      - "@innate/scene-mocks"
      - "@innate/agent-ui"
      - "@innate/fe-skillkits"
      - "@innate/tsconfig"
    desc: 前端基座 monorepo（@innate/* 包与 Admin 模板）
